# Phase 6: Docker Compose Production Configuration
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: samplepos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    # SECURITY: loopback only. Docker-published ports bypass UFW; never expose Postgres publicly.
    # Containers reach it as postgres:5432 on samplepos-network; operators use an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - samplepos-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: samplepos-redis
    restart: unless-stopped
    # SECURITY: password required + loopback-only publish. An unauthenticated public Redis was
    # attacked (SLAVEOF/CONFIG SET/MODULE LOAD/FLUSHALL). The password comes from .env and is
    # written to a config file inside the container so it never appears in process arguments.
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - sh
      - -c
      - |
        umask 077
        {
          echo "requirepass $$REDIS_PASSWORD"
          echo "protected-mode yes"
          echo "stop-writes-on-bgsave-error no"
          echo "appendonly yes"
          echo "appendfsync everysec"
          echo "maxmemory-policy noeviction"
          echo 'rename-command SLAVEOF ""'
          echo 'rename-command REPLICAOF ""'
          echo 'rename-command MODULE ""'
          echo 'rename-command DEBUG ""'
        } > /tmp/redis-secure.conf
        exec redis-server /tmp/redis-secure.conf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - samplepos-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: SamplePOS.Server/Dockerfile
    container_name: samplepos-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-pos_system}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      API_PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ACCOUNTING_API_URL: http://accounting-api:5062
      ACCOUNTING_API_KEY: ${ACCOUNTING_API_KEY:?ACCOUNTING_API_KEY must be set}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      samplepos-network:
      app-network:
        aliases:
          - backend
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # C# Accounting API
  accounting-api:
    build:
      context: ./server-dotnet/accounting-api/AccountingApi
      dockerfile: Dockerfile
    container_name: samplepos-accounting
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5062
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pos_system};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password}
      ApiSettings__SharedSecretKey: ${ACCOUNTING_API_KEY:?ACCOUNTING_API_KEY must be set}
      Logging__LogLevel__Default: Information
    ports:
      - "5062:5062"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - samplepos-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5062/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: samplepos.client/Dockerfile
    container_name: samplepos-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
      VITE_APP_NAME: SamplePOS
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - samplepos-network

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: samplepos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - accounting-api
    networks:
      - samplepos-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  samplepos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  app-network:
    external: true
    name: smarterp_app-network
